name: Build Native IGseek Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '!android-app/builds/**'
      - '.github/workflows/build-apk.yml'
      - 'firebase-applet-config.json'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Базовый URL backend IGseek (опционально, можно менять и в настройках приложения)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Test & Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Compile Native APK
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$INPUT_API_URL" ]; then
            EXTRA_ARGS="-PIGSEEK_API_BASE_URL=${INPUT_API_URL}"
          fi
          for attempt in 1 2 3; do
            if gradle -p android-app assembleDebug testDebugUnitTest $EXTRA_ARGS --no-daemon --console=plain; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient Gradle failure (attempt $attempt), retrying in 10s..."
            sleep 10
          done

      - name: Stage & Verify Compiled APK
        run: |
          mkdir -p android-app/builds
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/builds/IGseek-v2.0-native-debug.apk
          ls -lh android-app/builds/IGseek-v2.0-native-debug.apk
          unzip -t android-app/builds/IGseek-v2.0-native-debug.apk | tail -n 5

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGseek-v2.0-native-debug
          path: android-app/builds/IGseek-v2.0-native-debug.apk
          retention-days: 90

      - name: Commit Built APK to android-app/builds/
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android-app/builds/IGseek-v2.0-native-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(android): update IGseek-v2.0-native-debug.apk [skip ci]"
            git push
          else
            echo "APK unchanged, skipping commit."
          fi
